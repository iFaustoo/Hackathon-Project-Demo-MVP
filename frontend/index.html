<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Memory Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Barra Lateral -->
        <aside id="sidebar" class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"></path>
                    </svg>
                </div>
                <h2 class="brand-text">Memory Engine</h2>
            </div>
            <div class="sidebar-title brand-text">PROYECTOS ACTIVOS</div>
            <ul id="project-list" class="project-list">
                <!-- JS inyectará los proyectos acá -->
            </ul>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="toggle-sidebar" class="icon-btn" title="Ocultar/Mostrar menú">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div>
                        <h1 id="project-title">Selecciona un proyecto</h1>
                        <p id="project-description" class="subtitle">La IA generará una bitácora automática basada en las comunicaciones.</p>
                    </div>
                </div>
                
                <!-- NUEVO: Controles derecha (Salud, Estado y PDF) -->
                <div class="topbar-right">
                    <span id="health-indicator" class="badge hidden"></span>
                    <span id="project-status" class="badge default-badge hidden"></span>
                    <button id="export-btn" class="icon-btn hidden" title="Exportar Reporte a PDF">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="loader" class="loader hidden">
                <div class="spinner"></div>
                <p>Procesando con modelo 120b...</p>
            </div>

            <div id="summary-container" class="summary-grid hidden">
                <!-- JS inyectará las tarjetas del resumen acá -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
